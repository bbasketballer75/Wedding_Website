<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Austin & Jordyn</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 30px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: 600;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        opacity: 0.9;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        padding: 12px 30px;
        background: white;
        color: #667eea;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 500;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .wifi-icon {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .status {
        margin-top: 40px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }

      .status h3 {
        margin-bottom: 10px;
        font-size: 1.2rem;
      }

      .status ul {
        list-style: none;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .status li {
        margin: 8px 0;
      }

      .status li::before {
        content: '✓ ';
        color: #4ade80;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon wifi-icon">📶</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry! Some parts of the site are
        still available.
      </p>

      <a href="/" class="btn" onclick="window.location.reload()">Try Again</a>

      <div class="status">
        <h3>Available Offline:</h3>
        <ul>
          <li>Previously viewed pages</li>
          <li>Wedding details & information</li>
          <li>Guest book entries</li>
        </ul>
      </div>
    </div>

    <script>
      // Check for connection and reload when online
      window.addEventListener('online', () => {
        window.location.reload()
      })

      // Update offline indicator
      function updateOnlineStatus() {
        const status = document.querySelector('.status h3')
        if (navigator.onLine) {
          status.textContent = 'Connection Restored!'
          setTimeout(() => window.location.reload(), 1000)
        }
      }

      window.addEventListener('online', updateOnlineStatus)

      // Periodically check for connection
      setInterval(() => {
        if (navigator.onLine) {
          fetch('/', { method: 'HEAD' })
            .then(() => window.location.reload())
            .catch(() => {})
        }
      }, 30000)
    </script>
  </body>
</html>
