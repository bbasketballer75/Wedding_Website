[build]
  publish = "dist"
  command = "npm run verify:env && npm run build"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "11.11.0"

[[redirects]]
  from = "/*"
  to = "https://www.theporadas.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["wedding.theporadas.com"]}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "npm run verify:env && npm run build"

[context.branch-deploy]
  command = "npm run verify:env && npm run build"
