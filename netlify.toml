[build]
  publish = "dist"
  command = "npm run verify:env && npm run build"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "11.11.0"

[[redirects]]
  from = "/*"
  to = "https://www.theporadas.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["wedding.theporadas.com"]}

[[edge_functions]]
  path = "/gallery"
  function = "gallery-share"

# Proxy VTT caption files through the same origin to satisfy browser cross-origin
# track restrictions. The media CDN has no CORS headers so the <track> element
# would otherwise be blocked with "Domains, protocols and ports must match".
[[redirects]]
  from = "/__vtt_proxy/*"
  to = "https://media.wedding.theporadas.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "npm run verify:env && npm run build"

[context.branch-deploy]
  command = "npm run verify:env && npm run build"
