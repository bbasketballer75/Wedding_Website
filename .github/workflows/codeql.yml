# CodeQL security analysis for Wedding_Website.
#
# Scope:
#   - queries: the CodeQL DEFAULT suite. We deliberately do NOT enable
#     security-extended. That was measured on a sibling repo and added 266
#     alerts in one scan, entirely in precision-medium heuristic families
#     (log-injection, overly-permissive-file, insecure-temporary-file, ...),
#     whose spot-checks were false positives. On a codebase this size that
#     volume would bury real findings rather than surface them.
#   - languages: javascript-typescript (TypeScript is bundled into the JS
#     analysis per CodeQL docs) and actions (workflow expression-injection
#     and `run:` script issues, which SHA-pinning does not address).
#
# Triggers:
#   - pull_request to main -- reviews a change BEFORE it merges, which is the
#     only point where a finding is cheap to act on.
#   - push to main (catches anything landing outside a PR)
#   - weekly cron Monday 06:00 UTC (picks up new advisories against unchanged
#     code)
#
# All actions are pinned to full commit SHAs, matching the supply-chain
# posture used elsewhere in this account.

name: "CodeQL"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          category: "/language:${{ matrix.language }}"
