name: PR Review (Claude)

# Auto-review pull requests via Claude Code action. Comments review findings
# inline. Does not block merge — reviewer's call. Triggered on PR open,
# synchronize (new commits), and reopened.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight review for the same PR when a new commit lands.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review with Claude
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Claude PR review requires CLAUDE_CODE_OAUTH_TOKEN repo secret to be
    # configured. Until then, this job fails (gracefully — continue-on-error)
    # so PRs are not blocked on missing config.
    continue-on-error: true
    # Only allow this workflow to read PR contents and post comments. No
    # write to code or secrets — this is a read-only reviewer.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request to the Wedding_Website_Clean
            repository. Focus your review on:

            1. Correctness: type errors, React anti-patterns, missed edge cases.
            2. Safety: missing useEffect deps, leaked subscriptions, state
               mutations in render.
            3. Tests: are new test cases meaningful? Are they using mocks
               correctly (vi.mock factory hoisting, vi.mocked vs require)?
            4. Build hygiene: no console.log, no dead imports, no unused
               vars, no leaked local-only paths.

            The PR description has the plan context. The diff is in
            ${{ github.event.pull_request.diff_url }}.

            Output a concise review (under 400 words):
            - Looks good
            - Minor issues (be specific)
            - Blockers (be specific, point to file:line)

            Do not approve or reject — humans decide. Just analyze and
            suggest. Keep tone direct, no fluff.
          allowed_tools: "Read,Grep,Glob,Bash"

      - name: Comment review on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Claude review (automated)\n\n${{ steps.review.outputs.conclusion || '_No issues found._' }}\n\n<sub>Run #${{ github.run_number }} on ${{ github.event.pull_request.head.sha }}</sub>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
