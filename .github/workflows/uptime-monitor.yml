name: Uptime Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SITE_URL: https://www.theporadas.com
      EXPECTED_TEXT: Austin & Jordyn
    steps:
      - name: Check site availability
        id: check
        shell: bash
        run: |
          set -euo pipefail

          status=$(curl -L --silent --show-error --output response.html --write-out "%{http_code}" "$SITE_URL")

          if [ "$status" != "200" ]; then
            echo "message=Expected HTTP 200 but received $status from $SITE_URL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if ! grep -q "$EXPECTED_TEXT" response.html; then
            echo "message=Homepage loaded but did not include expected text '$EXPECTED_TEXT'" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "message=Site responded with HTTP 200 and expected content." >> "$GITHUB_OUTPUT"

      - name: Create uptime alert issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Uptime Alert: Wedding site check failed'
            const body = [
              `The automated uptime check failed for ${process.env.SITE_URL}.`,
              '',
              `Failure: ${process.env.FAILURE_MESSAGE || 'Unknown failure'}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Time (UTC): ${new Date().toISOString()}`
            ].join('\n')

            // Search across open and closed issues so a closed alert can be
            // reopened instead of spawning a duplicate issue.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            })

            const existing = issues.find((issue) => issue.title === title)

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })
              return
            }

            // Reopen a closed alert so the single issue stays the canonical tracker.
            if (existing.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open'
              })
            }

            // Throttle comments to one per hour to avoid spamming the issue
            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString()
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              since: oneHourAgo
            })

            const recentBotComment = comments.find(
              (comment) => comment.user && comment.user.login === 'github-actions[bot]'
            )

            if (!recentBotComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              })
            }
        env:
          FAILURE_MESSAGE: ${{ steps.check.outputs.message }}
