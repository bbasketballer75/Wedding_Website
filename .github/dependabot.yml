# Dependabot configuration — npm weekly + GitHub Actions weekly.
# Mirrors the upstream behavior of bbasketballer75/hermes-agent and
# bbasketballer75/honcho (which have this config) but tuned for the
# Wedding_Website_Clean repository layout.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        applies-to: version-updates
        patterns:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "minor"
          - "patch"
