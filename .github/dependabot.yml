# Dependabot configuration — npm weekly + GitHub Actions weekly.
# Mirrors the upstream behavior of bbasketballer75/hermes-agent and
# bbasketballer75/honcho (which have this config) but tuned for the
# Wedding_Website_Clean repository layout.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        applies-to: version-updates
        patterns:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "minor"
          - "patch"
    # Dependabot's actions updater returns an unknown_error for
    # github/codeql-action (the CodeQL action versions are managed by GitHub's
    # code-scanning setup); ignore it so the weekly updater job does not fail.
    ignore:
      - dependency-name: "github/codeql-action"
  # The rebuild is a separate npm package (rebuild/package.json). Dependabot
  # security updates auto-discover it; the minimatch advisory is only reachable
  # through typescript-eslint in the dev lint stack (never shipped in the
  # browser bundle) and has no patched version compatible with the current
  # typescript-eslint range, so the update attempt fails. Tracked for the next
  # lint-stack upgrade instead of failing the Dependabot updater weekly.
  - package-ecosystem: "npm"
    directory: "/rebuild"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps-rebuild)"
    ignore:
      - dependency-name: "minimatch"
