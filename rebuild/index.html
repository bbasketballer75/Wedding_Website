<!doctype html>
<html lang="en" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-custom.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- seo:start -->
    <!-- Primary Meta Tags -->
    <title>Austin &amp; Jordyn | Wedding Archive</title>
    <meta name="title" content="Austin &amp; Jordyn | Wedding Archive" />
    <meta
      name="description"
      content="A permanent digital archive of our wedding day. Relive our story, browse the films, and view the galleries."
    />
    <meta name="keywords" content="wedding, archive, austin, jordyn, marriage, collection" />
    <meta name="author" content="Austin &amp; Jordyn" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.theporadas.com/" />
    <meta property="og:title" content="Austin &amp; Jordyn | Wedding Archive" />
    <meta
      property="og:description"
      content="A permanent digital archive of our wedding day. Relive our story, browse the films, and view the galleries."
    />
    <meta property="og:image" content="https://www.theporadas.com/images/og-image.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.theporadas.com/" />
    <meta property="twitter:title" content="Austin &amp; Jordyn | Wedding Archive" />
    <meta
      property="twitter:description"
      content="A permanent digital archive of our wedding day. Relive our story, browse the films, and view the galleries."
    />
    <meta property="twitter:image" content="https://www.theporadas.com/images/og-image.webp" />
    <link rel="canonical" href="https://www.theporadas.com/" />
    <!-- Canonical URL is updated per-page at runtime by the route metadata hook. -->

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="theme-color" content="#d4af37" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="A&amp;J Wedding" />
    <meta name="application-name" content="A&amp;J Wedding" />
    <meta name="msapplication-TileColor" content="#d4af37" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <!-- seo:end -->

    <!-- PWA manifest (frozen head parity; files are generated by scripts/generate-sitemap.mjs) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
