# Greenfield deploy surface (Wave 8 W8-1)

The legacy root `netlify.toml` still serves production until the owner-approved
cutover. This file is the rebuild's deploy configuration; it is **not deployed
yet**. When the rebuild becomes the site, deploy with Netlify's base directory
set to `rebuild` so this config, `rebuild/package.json` and `rebuild/dist` are
used.

## Build pipeline

Parity/preview builds and CI drift runs use the plain Vite build (`npm run build`
= `vite build`): they emit the frozen static head byte-for-byte and run no
prerender/PWA layer, which is what keeps the parity text gate green.

The production deploy build additionally runs the two generators after
`vite build` (Lead wires these scripts in `package.json`):

```json
"build": "vite build && npm run build:seo",
"build:seo": "node scripts/generate-sitemap.mjs && node scripts/prerender.mjs"
```

- `generate-sitemap.mjs` writes `public/{sitemap.xml,robots.txt,manifest.webmanifest,sw.js}`
  (and the `dist/` copies when a build already exists) from
  `src/app/seo/routeMeta.json`, and fails on drift from `contracts/seo-pwa.json`.
- `prerender.mjs` rewrites the `<!-- seo:start -->…<!-- seo:end -->` block of the
  built `dist/index.html` into one static HTML file per public route so crawlers
  and no-JS clients get per-route metadata. Hydrated runtime metadata is
  unchanged; for the frozen stale-metadata defects (`/activity`, `/admin/*`) the
  prerendered files carry the corrected crawlable tags while the hydrated runtime
  keeps the frozen tags, so parity capture stays green.

Both support `--check` for CI drift detection.

## PWA flag

`VITE_ENABLE_PWA=1` is the production-only gate for install metadata (manifest
link, apple capability meta) and service-worker registration. Parity/preview
builds must NOT set it (see `src/app/pwa.ts`); production Netlify builds set it
in the environment panel or via the `[build.environment]` entry below.

## Routing

- `/admin/*` serves the prerendered noindex admin shell (`admin/index.html`); the
  static `admin/login/index.html` takes precedence over the rewrite.
- `/guest/*` serves the prerendered noindex guest-album shell.
- Everything else falls back to the prerendered SPA `index.html` (200), matching
  the frozen app's client-side routing.
- The `gallery-share` edge function keeps the frozen `/gallery?share=` OG
  contract. The function file itself stays at the repository-root
  `netlify/edge-functions/gallery-share.ts`; when deploying with base `rebuild`
  the function directory must be shared/kept in sync (Lead decision, see the
  W8-1 report).

## Headers

Security headers and cache policy mirror the frozen `public/_headers` contract
(from `contracts/seo-pwa.json`). Additions for the rebuild:

- `Content-Security-Policy` has no `unsafe-eval`; Sentry uses `connect-src` only
  (no SDK script is loaded) and Google Analytics scripts remain allowlisted.
- `/*.html` is explicitly revalidatable so prerendered metadata is never served
  from a stale cache.

