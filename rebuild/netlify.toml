# Greenfield deploy surface.
#
# Production Netlify builds this directory (site base = `rebuild`) from `main`;
# `npm run build:prod` emits the prerendered PWA bundle into `dist`. Static
# headers/redirects live in `public/_headers` and `public/_redirects`.

[build]
  command = "npm run build:prod"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11.11.0"
  # Production-only PWA/install layer gate (parity/preview builds leave it unset).
  VITE_ENABLE_PWA = "1"
  # Browser-safe runtime config for the dedicated Supabase project (anon key
  # only — never place the service-role key here).
  VITE_SUPABASE_URL = "https://faurvrckvatfcswsyobc.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhdXJ2cmNrdmF0ZmNzd3N5b2JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNjY0NjMsImV4cCI6MjEwOTk0MjQ2M30.iwmHUmNsQyO0wlDRdi9CU-roCqD6mWdZUnN4Aas9Xlc"
  VITE_SITE_URL = "https://www.theporadas.com"
  VITE_MEDIA_BASE_URL = "https://media.wedding.theporadas.com"
  VITE_UPLOAD_MODE = "live"
  VITE_SENTRY_DSN = "https://a3e91a8bb1d2fe48c19cb84944dea8f7@o4509754165755904.ingest.us.sentry.io/4512409698369536"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/guest/*"
  to = "/guest/index.html"
  status = 200

[[redirects]]
